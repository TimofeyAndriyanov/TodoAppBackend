services:
  todoapp-postgres:
    image: postgres:18.1-alpine
    container_name: todoapp-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: todoapp-env-port-forwarder
    command: tcp-listen:${POSTGRES_PORT},fork,reuseaddr tcp-connect:todoapp-postgres:${POSTGRES_PORT}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
  
  